<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe playground</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/hosts.css">
<link rel="stylesheet" href="/playground.css">
<script type="module" src="/playground/app.js"></script>
</head>
<body>
<header class="pg-header">
  <h1>Wireframe playground</h1>
  <fieldset class="pg-toggle">
    <legend>Scheme</legend>
    <label><input type="radio" name="scheme" value="light">Light</label>
    <label><input type="radio" name="scheme" value="dark">Dark</label>
  </fieldset>
  <fieldset class="pg-toggle">
    <legend>Host</legend>
    <label><input type="radio" name="host" value="standalone">Bare page</label>
    <label><input type="radio" name="host" value="column">Document column, 710 px</label>
  </fieldset>
</header>
<div class="pg-layout">
<nav class="pg-sidebar" aria-labelledby="pg-sidebar-title">
  <h2 id="pg-sidebar-title">Examples</h2>
  <div class="pg-groups" id="pg-groups"></div>
  <a class="pg-item" id="pg-scratch" href="#scratch">Scratch</a>
</nav>
<main class="pg-page" id="pg-page" aria-labelledby="pg-page-title">
  <h2 id="pg-page-title">Examples</h2>
  <div id="pg-content"></div>
  <p class="pg-notice" id="pg-notice" role="status"></p>
  <form class="pg-add" id="pg-add" hidden>
    <h3>Add Scratch as an example</h3>
    <p class="pg-hint">Choose an existing family and entry, or enter new ones. The example name must be new.</p>
    <div class="pg-add-fields">
      <label>Family
        <input id="pg-new-family" name="family" list="pg-families" required maxlength="64" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="forms" autocomplete="off">
      </label>
      <label>Entry
        <input id="pg-new-entry" name="entry" list="pg-entries" required maxlength="64" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="2-simple-forms" autocomplete="off">
      </label>
      <label>Name
        <input id="pg-new-name" name="name" list="pg-names" required maxlength="64" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="settings" autocomplete="off">
      </label>
      <button type="submit">Add</button>
    </div>
    <datalist id="pg-families"></datalist>
    <datalist id="pg-entries"></datalist>
    <datalist id="pg-names"></datalist>
  </form>
</main>
</div>
</body>
</html>
