<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe playground</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/hosts.css">
<link rel="stylesheet" href="/playground.css">
<script type="module" src="/playground/app.js"></script>
</head>
<body>
<header class="pg-header">
  <h1>Wireframe playground</h1>
  <fieldset class="pg-toggle">
    <legend>Scheme</legend>
    <label><input type="radio" name="scheme" value="light">Light</label>
    <label><input type="radio" name="scheme" value="dark">Dark</label>
  </fieldset>
  <fieldset class="pg-toggle">
    <legend>Host</legend>
    <label><input type="radio" name="host" value="standalone">Bare page</label>
    <label><input type="radio" name="host" value="column">Document column, 710 px</label>
  </fieldset>
</header>

<div class="pg-layout">
<nav class="pg-sidebar" aria-labelledby="pg-sidebar-title">
  <h2 id="pg-sidebar-title">Examples</h2>
  <div class="pg-groups" id="pg-groups"></div>
  <form class="pg-add" id="pg-add">
    <label for="pg-new-name">Save the editor's source as a new example, in a group as group/name</label>
    <span class="pg-add-row">
      <input id="pg-new-name" name="name" required maxlength="129" pattern="([a-z0-9]+(-[a-z0-9]+)*/)?[a-z0-9]+(-[a-z0-9]+)*"
        placeholder="dialogs/settings" title="Lowercase letters and digits joined by hyphens, after a group and a slash" autocomplete="off">
      <button type="submit">Add</button>
    </span>
  </form>
</nav>

<main class="pg-main">
  <section class="pg-pane" aria-labelledby="pg-name">
    <div class="pg-bar">
      <h2 id="pg-name">Scratch</h2>
      <span class="pg-dirty" id="pg-dirty" hidden>Unsaved edits</span>
      <button type="button" id="pg-save" title="Save to examples/ (Ctrl+S or ⌘S)">Save</button>
    </div>
    <div class="pg-editor">
      <pre class="pg-gutter" id="pg-gutter" aria-hidden="true"></pre>
      <textarea id="pg-source" aria-labelledby="pg-name" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
    </div>
    <p class="pg-notice" id="pg-notice" role="status"></p>
  </section>

  <section class="pg-pane" aria-labelledby="pg-render-title">
    <div class="pg-bar">
      <h2 id="pg-render-title">Render</h2>
      <span class="pg-stale" id="pg-stale" hidden>Stale: the source has an error, so this is its last render without one</span>
    </div>
    <div class="pg-preview" id="pg-preview"></div>
    <p class="pg-summary"><span class="pg-label">Summary</span> <span id="pg-summary"></span></p>

    <h3>Diagnostics</h3>
    <ol class="pg-diagnostics" id="pg-diagnostics"></ol>

    <h3>Approval</h3>
    <div class="pg-approval">
      <p class="pg-approval-head">
        <span class="pg-badge" id="pg-status"></span>
        <button type="button" id="pg-approve">Approve</button>
      </p>
      <p class="pg-hint" id="pg-approve-hint"></p>
      <div id="pg-review"></div>
    </div>
  </section>
</main>
</div>
</body>
</html>
