[tools]
node = "26"
pnpm = "10"

[tasks.install]
description = "Install dependencies (frozen lockfile)"
# PNPM_STORE_DIR is set by CI to the store it caches; unset locally.
run = 'pnpm install --frozen-lockfile ${PNPM_STORE_DIR:+--store-dir "$PNPM_STORE_DIR"}'

[tasks.lint]
description = "Lint with Biome (lint only, the formatter stays off)"
run = "pnpm lint"

[tasks.typecheck]
description = "Typecheck (tsc --noEmit)"
run = "pnpm typecheck"

[tasks.test]
description = "Run the test suite"
run = "pnpm test"

[tasks.screenshots]
description = "Browser checks and golden screenshots (needs `pnpm exec playwright install chromium`; goldens come from CI)"
run = "pnpm screenshots"
