services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    working_dir: /workspace
    volumes:
      - .:/workspace
      - wireframe-md-node-modules:/workspace/node_modules
    command:
      - sh
      - -lc
      - |
          npm install -g bun@1.3.10
          bun install --frozen-lockfile
          bun run test:visual

volumes:
  wireframe-md-node-modules:
