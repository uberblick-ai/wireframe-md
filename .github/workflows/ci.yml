name: CI

# The merge gate: lint, typecheck, tests, the build and its package check, and
# the screenshot check on every pull request and on main.
# No secrets: none of these steps needs one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck and tests
    # A fixed image, so the goldens don't change when ubuntu-latest moves on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Test the pull request's head itself, not GitHub's merge with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Installs the toolchain pinned in mise.toml and puts `mise` on PATH.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - id: install
        run: mise run install
        env:
          PNPM_STORE_DIR: ~/.pnpm-store

      # Each check runs even when an earlier one fails.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run test

      # The package as npm would publish it: packed, installed into a scratch
      # project and imported there.
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mise run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mise run check-package

      # The screenshot check: layout and theming in Chromium, and the goldens in
      # test/screenshots/goldens, which come from this job's environment.
      - id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - id: screenshots
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: mise run screenshots

      # On a failure, render a fresh golden for every one that differs and
      # upload them with the diffs, so a PR can take its goldens from here.
      - if: ${{ !cancelled() && steps.screenshots.outcome == 'failure' }}
        continue-on-error: true
        run: pnpm exec playwright test --update-snapshots=changed --output=test-results/update
      - if: ${{ !cancelled() && steps.screenshots.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: |
            test/screenshots/goldens/
            test-results/
          if-no-files-found: ignore
