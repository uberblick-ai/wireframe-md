# wireframe-md's delivery loop. Shared policy: .agents/ub_agents.md; project guide: AGENTS.md.
repository: uberblick-ai/wireframe-md
shared-instructions: .agents/ub_agents.md
queue:
  milestones: ignore
  dependencies: wait

# Reinstall control-checkout dependencies after watched files change on refresh.
checkout-setup:
  command: [mise, run, install]
  when-changed: [pnpm-lock.yaml, mise.toml]
  timeout-seconds: 600

# Default arguments for each CLI; add the other CLI's entry for mixed runtimes.
# Grants unattended edits and git/gh/report commands: https://github.com/uberblick-ai/ub-agents/blob/main/docs/configuration.md#runtime-permissions
# Add the project's check commands to --allowedTools: "Bash(<project check command>)".
runtime-args:
  claude:
    - --permission-mode
    - acceptEdits
    - --permission-prompts
    - none
    # The run's private scratch directory, writable without a prompt.
    - --add-dir
    - "{scratch}"
    - --allowedTools
    - "Bash(git *)"
    - "Bash(gh *)"
    - "Bash({report_command} report *)"
    - "Bash({report_command} read *)"
    - "Bash(ub-agents *)"
    # The project corpus in its Uberblick workspace (.uberblick.json, .mcp.json).
    - "mcp__wireframe-corpus__*"
    # Uberblick's product corpus (.mcp.json), read-only: its Web UI pages hold
    # the sketches the format has to draw.
    - "mcp__uberblick-product-corpus__get_help"
    - "mcp__uberblick-product-corpus__get_sidebar"
    - "mcp__uberblick-product-corpus__list_docs"
    - "mcp__uberblick-product-corpus__list_tags"
    - "mcp__uberblick-product-corpus__get_doc"
    - "mcp__uberblick-product-corpus__get_data"
    - "mcp__uberblick-product-corpus__search"
    - "mcp__uberblick-product-corpus__backlinks"
    - "mcp__uberblick-product-corpus__find_decisions"
    # The project's checks (mise tasks) and its package manager.
    - "Bash(mise *)"
    - "Bash(pnpm *)"
    - "Bash(node *)"
    # Read-only and scratch helpers, so compound commands are not denied part by part.
    - "Bash(cd *)"
    - "Bash(mkdir *)"
    - "Bash(mktemp *)"
    - "Bash(head *)"
    - "Bash(tail *)"
    - "Bash(echo *)"
    - "Bash(cat *)"
    - "Bash(grep *)"
    - "Bash(sed *)"
    - "Bash(ls *)"
    - "Bash(wc *)"
    - "Bash(sort *)"
    - "Bash(find *)"
    - "Bash(jq *)"
# An agent's runtime-args list or mapping replaces these defaults entirely.
# Omit the agent key to inherit; an empty list or mapping disables the defaults.

# Customize these outcomes and rules with the project's owners.
agents:
  issue-preparer:
    runtime: "claude:claude-opus-5-5:xhigh"
    kind: issue
    trigger: needs-preparation
    outcomes:
      prepared: {add: [ready]}
      needs-human: {add: [needs-human]}
    instructions: .agents/issue-preparer.md
    worktree: true
    agent-timeout-minutes: 60

  implementer:
    runtime: "claude:claude-opus-5-5:xhigh"
    trigger: [ready, needs-changes]
    outcomes:
      handed-off: {add: [needs-review]}
    instructions: .agents/implementer.md
    worktree: true
    agent-timeout-minutes: 180

  reviewer:
    runtime: "claude:claude-opus-5-5:xhigh"
    kind: pr
    trigger: needs-review
    outcomes:
      approved: {add: [ready-to-merge]}
      changes-requested: {add: [needs-changes]}
    instructions: .agents/reviewer.md
    worktree: true
    agent-timeout-minutes: 180
    # For independent cross-provider review, configure an eligible alternative:
    # runtime: "claude:claude-opus-5-5:high"
    # different-runtime-from: implementer
    # Native GitHub approval requires an identity other than the PR author.

  integrator:
    runtime: "claude:claude-opus-5-5:xhigh"
    kind: pr
    trigger: ready-to-merge
    outcomes:
      merged: {}
      maintainer-merge: {add: [needs-human]}
      changes-requested: {add: [needs-changes]}
    instructions: .agents/integrator.md
    worktree: true
    agent-timeout-minutes: 180

limits:
  agent-timeout-minutes: 180
  max-attempts: 5
  retry-backoff-seconds: 60
  max-backoff-seconds: 3600

poll-seconds: 30
stop-labels: [needs-human]
